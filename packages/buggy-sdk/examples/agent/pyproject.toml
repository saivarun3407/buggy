[project]
name = "buggy-example-agent"
version = "0.0.1"
description = "Buggy plugin scaffolded by buggy-sdk."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"

dependencies = [
    "buggy-sdk",
]

[project.entry-points."buggy.agents"]
buggy_example_agent = "buggy_example_agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buggy_example_agent"]
