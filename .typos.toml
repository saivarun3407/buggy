# Security / cloud / legal acronyms typos misreads (it splits the
# token and flags the prefix — e.g. "NDAs" → suggests "ANDAs" because
# "ND" looks like a typo of "AND"). extend-identifiers is the right
# knob: it whitelists the FULL identifier (case-sensitive, no token
# splitting) rather than a lowercased word fragment.
[default.extend-identifiers]
"wheres" = "wheres"  # Cypher predicate clauses
"NDA" = "NDA"        # Non-Disclosure Agreement
"NDAs" = "NDAs"      # Non-Disclosure Agreements (plural)
"AKS" = "AKS"        # Azure Kubernetes Service
"RTO" = "RTO"        # Red Team Operator (also Recovery Time Objective)
# Async variants of LangChain agent middleware hooks. Buggy names
# them ``a<sync-name>`` (``aafter_model``, ``abefore_model``, ``aafter_agent``)
# to mirror the langchain.agents.middleware convention. typos misreads
# the leading ``a`` as a typo of the base name.
"aafter_model" = "aafter_model"
"aafter_agent" = "aafter_agent"
"abefore_model" = "abefore_model"
"abefore_agent" = "abefore_agent"
"awrap_model_call" = "awrap_model_call"
"awrap_tool_call" = "awrap_tool_call"

[files]
# Skip vendored / generated content from typos
extend-exclude = [
    "package-lock.json",
    "uv.lock",
    "go.sum",
    "*.lock",
    "*.snap",
    "assets/**",
    "benchmark/results/**",
    "packages/buggy/buggy/skills/_corpus/**",
    "reference/**",
    # ICS/OT skill bodies are dense with industrial-protocol jargon that
    # typos misreads: "OT" (Operational Technology), "ot" inside
    # "ics ot ..." trigger lists, "BA" (BACnet/Building Automation), etc.
    # Scoped to this directory so the rest of the tree keeps full typo
    # coverage rather than globally allow-listing two-letter tokens.
    "packages/buggy/buggy/skills/standard/exploit/ics-ot/**",
    "packages/buggy/buggy/skills/standard/ics/**",
    # Sisyphus-added domain skill seeds with industrial / wireless / OT
    # protocol jargon that typos misreads (BACnet, OT tag list, ics, etc.)
    "packages/buggy/buggy/skills/standard/iot/**",
    "packages/buggy/buggy/skills/standard/dfir/**",
    "packages/buggy/buggy/skills/standard/phish/**",
    "packages/buggy/buggy/skills/standard/supply-chain/**",
    "packages/buggy/buggy/skills/standard/osint/**",
    ".omo/plans/**",
    # Adversary-emulation playbooks + APT/CTI reference cards: dense with
    # threat-intel jargon typos misreads — "OT" (Operational Technology),
    # "HPE" (Hewlett Packard Enterprise), product names like "MOVEit".
    # Scoped to these dirs to match the ics-ot/iot exclusion pattern rather
    # than globally allow-listing two-letter tokens.
    "packages/buggy/buggy/skills/standard/soundwave/threat-profile/emulation/**",
    "packages/buggy/buggy/skills/standard/soundwave/threat-profile/references/**",
]
